<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
<title id="title">What changes after age standardization?</title><desc id="desc">Paired crude and standardized rates. Teal horizontal intervals are approximate 95% Poisson intervals for standardized rates only.</desc>
