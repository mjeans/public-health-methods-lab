<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">Nutrient-density differences</title><desc id="desc">Separate panels show fiber and sodium mean differences with illustrative normal-approximation 95% confidence intervals; the vertical line is zero.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif">
<text x="40.0" y="46.0" font-size="27" fill="#142d42" text-anchor="start" font-weight="700">Nutrient-density differences</text>
<text x="40.0" y="76.0" font-size="16" fill="#687b89" text-anchor="start" font-weight="400">Synthetic nutrition education minus comparison | 10 participants per group</text>
<line x1="40.0" y1="100.0" x2="960.0" y2="100.0" stroke="#dae3e9" stroke-width="1" />
<text x="40.0" y="150.0" font-size="19" fill="#142d42" text-anchor="start" font-weight="700">Fiber (g per 1,000 kcal)</text>
<line x1="368.1" y1="165.0" x2="368.1" y2="195.0" stroke="#687b89" stroke-width="1.5" />
<line x1="535.2" y1="180.0" x2="821.9" y2="180.0" stroke="#087e83" stroke-width="4" />
<circle cx="678.6" cy="180" r="7" fill="#087e83"/>
<text x="40.0" y="188.0" font-size="24" fill="#087e83" text-anchor="start" font-weight="700">4.07</text>
<text x="40.0" y="211.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">95% CI 2.19 to 5.95</text>
<text x="300.0" y="224.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">-0.9</text>
<text x="368.1" y="224.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">0.0</text>
<text x="890.0" y="224.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">6.8</text>
<text x="40.0" y="305.0" font-size="19" fill="#142d42" text-anchor="start" font-weight="700">Sodium (mg per 1,000 kcal)</text>
<line x1="821.9" y1="320.0" x2="821.9" y2="350.0" stroke="#687b89" stroke-width="1.5" />
<line x1="368.1" y1="335.0" x2="631.7" y2="335.0" stroke="#087e83" stroke-width="4" />
<circle cx="499.9" cy="335" r="7" fill="#087e83"/>
<text x="40.0" y="343.0" font-size="24" fill="#087e83" text-anchor="start" font-weight="700">-334.38</text>
<text x="40.0" y="366.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">95% CI -471.27 to -197.48</text>
<text x="300.0" y="379.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">-542.0</text>
<text x="821.9" y="379.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">0.0</text>
<text x="890.0" y="379.0" font-size="14" fill="#687b89" text-anchor="middle" font-weight="400">70.7</text>
<text x="40.0" y="452.0" font-size="15" fill="#687b89" text-anchor="start" font-weight="400">Two-day recalls; density = mean nutrient / mean energy × 1,000.</text>
<text x="40.0" y="486.0" font-size="14" fill="#687b89" text-anchor="start" font-weight="400">Illustrative normal intervals for small synthetic samples. Differences are descriptive, not causal.</text>
</g></svg>
