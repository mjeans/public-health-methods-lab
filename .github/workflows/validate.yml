name: Validate public health methods lab

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python tests/test_methods.py
      - name: Regenerate reference outputs
        run: python scripts/run_analysis.py
      - name: Confirm deterministic outputs
        run: git diff --exit-code

