name: Validate research artifacts
on:
  push:
    branches: [main]
    paths:
      - "projects/methods-stress-test/**"
      - "projects/nutrition-machine-learning/**"
      - "scripts/build_nutrition_brief.py"
      - "scripts/verify_research_assets.py"
      - "scripts/requirements-brief.txt"
      - ".zenodo.json"
      - "CITATION.cff"
      - ".github/workflows/research-artifacts.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            projects/methods-stress-test/requirements.txt
            scripts/requirements-brief.txt
      - run: python -m pip install -r projects/methods-stress-test/requirements.txt -r scripts/requirements-brief.txt
      - name: Test estimators and uncertainty calculations
        run: python -m unittest discover -s projects/methods-stress-test/tests -v
      - name: Reproduce all 46,000 synthetic datasets
        run: python projects/methods-stress-test/scripts/run_simulation.py --check
      - name: Build the brief from frozen aggregate evidence
        run: python scripts/build_nutrition_brief.py
      - name: Validate the brief, figures, provenance, and citation metadata
        run: python scripts/verify_research_assets.py
      - name: Check generated brief reproducibility
        run: git diff --exit-code -- projects/nutrition-machine-learning/outputs/research-brief.html projects/nutrition-machine-learning/outputs/brief-provenance.json projects/nutrition-machine-learning/output/pdf/nutrition-ml-research-brief.pdf
