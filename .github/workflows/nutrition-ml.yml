name: Validate nutrition ML
on:
  push:
    branches: [main]
    paths:
      - "projects/nutrition-machine-learning/**"
      - ".github/workflows/nutrition-ml.yml"
  pull_request:
    paths:
      - "projects/nutrition-machine-learning/**"
      - ".github/workflows/nutrition-ml.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/nutrition-machine-learning
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/nutrition-machine-learning/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (synthetic fixtures only)
        run: python -m unittest discover -s tests -v
      - name: Download verified public inputs and reproduce all models
        run: python scripts/run_pipeline.py
      - name: Check numerical reproduction and publication boundaries
        run: python scripts/verify_outputs.py
